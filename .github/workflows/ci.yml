name: BFF verification

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify with Maven (unit & integration tests)
        run: bash mvnw -B -ntp verify
      - name: Build container image after tests pass
        run: docker build -t eventomax-bff:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bff-test-reports
          path: target/surefire-reports/
