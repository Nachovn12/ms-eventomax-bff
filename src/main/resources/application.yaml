spring:
  application:
    name: ms-eventomax-bff
  mvc:
    formcontent:
      filter:
        enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}

eventomax:
  security:
    jwt:
      audience: ${ENTRA_AUDIENCE}
  downstream:
    productions-base-url: ${PRODUCTIONS_BASE_URL}
    catalog-base-url: ${CATALOG_BASE_URL}
    report-base-url: ${REPORT_BASE_URL}
    audit-base-url: ${AUDIT_BASE_URL}
    notify-base-url: ${NOTIFY_BASE_URL:http://localhost:8083}
    rabbit-admin-base-url: ${RABBIT_ADMIN_BASE_URL:http://localhost:8086}
    connect-timeout: ${DOWNSTREAM_CONNECT_TIMEOUT:3s}
    read-timeout: ${DOWNSTREAM_READ_TIMEOUT:10s}
